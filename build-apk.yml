name: Build installable APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IRON_KEYSTORE_PATH: ${{ github.workspace }}/.private/iron.jks
      IRON_STORE_PASSWORD: ${{ secrets.IRON_STORE_PASSWORD }}
      IRON_KEY_ALIAS: ${{ secrets.IRON_KEY_ALIAS }}
      IRON_KEY_PASSWORD: ${{ secrets.IRON_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Load persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.IRON_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$IRON_STORE_PASSWORD" && test -n "$IRON_KEY_ALIAS" && test -n "$IRON_KEY_PASSWORD" || { echo 'Configure the four IRON signing secrets described in README.md'; exit 1; }
          mkdir -p .private
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$IRON_KEYSTORE_PATH"
          chmod 600 "$IRON_KEYSTORE_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build release
        env:
          TZ: Asia/Seoul
        run: |
          node --check app/src/main/assets/app.js
          node --test tests/*.test.cjs
          gradle --no-daemon assembleRelease lintRelease
      - name: Verify signature and package
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/iron-project-4.4.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/iron-project-4.4.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 dist/iron-project-4.4.apk > dist/alignment.txt
          python3 scripts/apk_manifest.py dist/iron-project-4.4.apk --assert-release > dist/manifest.json
          cd dist
          sha256sum iron-project-4.4.apk > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and update the signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke-apk.sh dist/iron-project-4.4.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: iron-project-4.4-installable
          path: dist/
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$IRON_KEYSTORE_PATH"
