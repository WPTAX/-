<body><div class="w"><div class="c"><h1>개인정보 및 건강 데이터 사용 안내</h1>
<p><b>아이언 프로젝트_이웅희</b>는 사용자의 동의 하에 Health Connect에서 Samsung Health가 기록한 달리기 운동의 시간, 거리 및 심박수만 읽습니다.</p>
<p>읽은 정보는 앱 화면의 주간·월간 통계와 그래프를 표시하는 용도로만 사용합니다. 외부 서버로 업로드하거나 제3자에게 전송하는 기능을 포함하지 않습니다.</p>
<p>수면시간은 사용자가 직접 입력하며 해당 기기의 앱 저장소에만 저장됩니다. Health Connect 권한은 Android 설정에서 언제든 취소할 수 있습니다.</p>
